  (function () {
    function atrapar(evento) {
      var transicion = evento.viewTransition;
      if (!transicion) return;
      if (transicion.ready) transicion.ready.catch(function () {});
      if (transicion.updateCallbackDone) transicion.updateCallbackDone.catch(function () {});
      if (transicion.finished) transicion.finished.catch(function () {});
    }
    function esTransicion(razon) {
      var mensaje = razon && typeof razon.message === "string" ? razon.message : (typeof razon === "string" ? razon : "");
      return /view.?transition|Transition was skipped|skipped view/i.test(mensaje);
    }
    window.addEventListener("pagereveal", atrapar);
    window.addEventListener("pageswap", atrapar);
    window.addEventListener("unhandledrejection", function (evento) {
      if (esTransicion(evento.reason)) evento.preventDefault();
    });
  })();
  </script>

    (function () {
      var n = "0";
      try {
        var texto = localStorage.getItem("colegual.matematicas.mockup.v1");
        var guardado = JSON.parse(texto || "null");
        var marca = Number(guardado && guardado.guardadoEn);
        var vigente = Number.isFinite(marca) && marca <= Date.now() && Date.now() - marca < 7 * 24 * 60 * 60 * 1000;
        if (!vigente) {
          if (texto) localStorage.removeItem("colegual.matematicas.mockup.v1");
        } else if (guardado && Array.isArray(guardado.carrito)) n = String(guardado.carrito.length);
      } catch (e) {
        try { localStorage.removeItem("colegual.matematicas.mockup.v1"); } catch (e2) {}
      }
      var nodos = document.querySelectorAll(".nav-cotizacion-n");
      for (var i = 0; i < nodos.length; i++) nodos[i].textContent = n;
    })();
